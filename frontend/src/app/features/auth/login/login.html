<main class="login-page">
  <form
    class="login-card card"
    (ngSubmit)="submit()"
    aria-labelledby="login-title"
  >
    <a class="login-brand" routerLink="/boards" aria-label="PinIt home">
      <img src="/PinIt_64.png" width="56" height="56" alt="" />
      <span>Pin<span class="brand-accent">I</span>t</span>
    </a>
    <p class="eyebrow">A space for ideas</p>
    <h1 id="login-title">Sign in</h1>

    @if (sessionMessage) {
    <p class="login-notice" role="status">{{ sessionMessage }}</p>
    } @if (errorMessage()) {
    <p class="login-error" role="alert">{{ errorMessage() }}</p>
    }

    <label class="form-field">
      Email
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
        required
      />
    </label>
    <label class="form-field">
      Password
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
    </label>
    <button
      class="btn btn-primary login-submit"
      type="submit"
      [disabled]="isSubmitting()"
    >
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
